apiVersion: v1
kind: ServiceAccount
metadata:
  name: clusterbloom-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clusterbloom-pod-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clusterbloom-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: clusterbloom-reader
    namespace: default
roleRef:
  kind: Role
  name: clusterbloom-pod-reader
  apiGroup: rbac.authorization.k8s.io